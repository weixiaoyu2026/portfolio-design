  <script>
    // Hide platform-injected watermarks / brand badges / floating avatars
    (function () {
      var BLOCK_KEYWORDS = ['豆包', 'doubao', 'Doubao', 'AI生成', 'AI 生成', '妙搭', 'MiaoDa'];
      var KNOWN_OWN = ['root', 'background-wrapper', 'side-nav', 'nav-progress', 'modal-backdrop', 'modal-close-btn'];

      function isOurElement(el) {
        if (!el) return false;
        var id = el.id || '';
        var cls = typeof el.className === 'string' ? el.className : '';
        for (var i = 0; i < KNOWN_OWN.length; i++) {
          if (id.indexOf(KNOWN_OWN[i]) !== -1 || cls.indexOf(KNOWN_OWN[i]) !== -1) return true;
        }
        // If it's inside #root, it's ours
        if (document.getElementById('root') && document.getElementById('root').contains(el)) return true;
        return false;
      }

      function hideIfWatermark(el) {
        if (!el || el.nodeType !== 1) return;
        if (isOurElement(el)) return;

        var style = window.getComputedStyle(el);
        if (style.position !== 'fixed' && style.position !== 'absolute') return;

        var text = (el.textContent || '').trim().slice(0, 50);
        if (!text) return;

        for (var i = 0; i < BLOCK_KEYWORDS.length; i++) {
          if (text.indexOf(BLOCK_KEYWORDS[i]) !== -1) {
            el.style.display = 'none';
            el.style.visibility = 'hidden';
            el.style.opacity = '0';
            el.style.pointerEvents = 'none';
            el.setAttribute('data-hidden-watermark', '1');
            return true;
          }
        }
        return false;
      }

      function scanAll() {
        var nodes = document.body.querySelectorAll('body > *, body > * > *');
        for (var i = 0; i < nodes.length; i++) {
          hideIfWatermark(nodes[i]);
        }
      }

      // Run immediately and on DOM changes
      if (document.body) scanAll();
      else document.addEventListener('DOMContentLoaded', scanAll);

      var mo = new MutationObserver(function (mutations) {
        for (var i = 0; i < mutations.length; i++) {
          var m = mutations[i];
          for (var j = 0; j < m.addedNodes.length; j++) {
            var node = m.addedNodes[j];
            if (node.nodeType === 1) {
              hideIfWatermark(node);
              // also check children
              var kids = node.querySelectorAll ? node.querySelectorAll('*') : [];
              for (var k = 0; k < kids.length; k++) hideIfWatermark(kids[k]);
            }
          }
        }
      });

      function startObserver() {
        if (!document.body) return;
        mo.observe(document.body, { childList: true, subtree: true });
        // Periodic sweep as safety net (platform may re-inject)
        setInterval(scanAll, 2000);
      }

      if (document.body) startObserver();
      else document.addEventListener('DOMContentLoaded', startObserver);
    })();
  </script>
